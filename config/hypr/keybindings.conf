# ============================================================
# Caelestia-style keybinds adapted for Noctra
# ============================================================

$mainMod = SUPER

# ── APPS ─────────────────────────────────────────────────────

# Terminal
bind = $mainMod, T, exec, kitty

# File manager
bind = $mainMod, E, exec, thunar

# Browser — будет работать после установки Zen
bind = $mainMod, W, exec, zen-browser

# App launcher
bind = $mainMod, A, exec, pkill rofi || rofi -show drun

# Caelestia-style: просто нажать Super
bindr = $mainMod, SUPER_L, exec, pkill rofi || rofi -show drun

# System monitor
bind = CTRL SHIFT, Escape, exec, kitty --class btop -e btop


# ── WINDOWS ──────────────────────────────────────────────────

# Close
bind = $mainMod, Q, killactive,

# Fullscreen
bind = $mainMod, F, fullscreen, 0

# Maximized but keep bar/gaps
bind = $mainMod ALT, F, fullscreen, 1

# Floating
bind = $mainMod ALT, Space, togglefloating,

# Pin
bind = $mainMod, P, pin,

# Alt+Tab
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# Focus window
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Move window
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# Resize like Caelestia
binde = $mainMod, Minus, resizeactive, -10 0
binde = $mainMod, Equal, resizeactive, 10 0
binde = $mainMod SHIFT, Minus, resizeactive, 0 -10
binde = $mainMod SHIFT, Equal, resizeactive, 0 10

# Mouse move / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ── WORKSPACES ───────────────────────────────────────────────

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Caelestia uses SUPER+ALT to move windows
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Previous / next workspace
bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod, mouse_up, workspace, -1

bind = CTRL $mainMod, Right, workspace, +1
bind = CTRL $mainMod, Left, workspace, -1

bind = $mainMod, Page_Down, workspace, +1
bind = $mainMod, Page_Up, workspace, -1

# Move window previous / next workspace
bind = $mainMod ALT, mouse_down, movetoworkspace, +1
bind = $mainMod ALT, mouse_up, movetoworkspace, -1

bind = $mainMod ALT, Page_Down, movetoworkspace, +1
bind = $mainMod ALT, Page_Up, movetoworkspace, -1


# ── SPECIAL WORKSPACE ────────────────────────────────────────



# ── NOCTRA / SYSTEM ──────────────────────────────────────────

# Notification center instead of Caelestia sidebar
bind = $mainMod, N, exec, swaync-client -t

# Power/session menu
bind = CTRL ALT, Delete, exec, ~/.config/waybar/scripts/sys-menu.sh

# Also convenient
bind = $mainMod, Escape, exec, ~/.config/waybar/scripts/sys-menu.sh

# Lock
bind = $mainMod, L, exec, hyprlock

# Sleep
bindl = $mainMod SHIFT, L, exec, systemctl suspend


# ── SCREENSHOTS ──────────────────────────────────────────────

# Full screenshot
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full

# Caelestia screenshot keys adapted to Noctra area capture
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod SHIFT ALT, S, exec, ~/.config/hypr/scripts/screenshot.sh area


# ── SCREEN RECORDING ─────────────────────────────────────────

# Full
bind = CTRL ALT, R, exec, ~/.config/hypr/scripts/screen-record.sh full

# Caelestia "with sound" key — пока обычная запись
bind = $mainMod ALT, R, exec, ~/.config/hypr/scripts/screen-record.sh full

# Area
bind = $mainMod SHIFT ALT, R, exec, ~/.config/hypr/scripts/screen-record.sh area


# ── MEDIA ────────────────────────────────────────────────────

bindl = CTRL $mainMod, Space, exec, playerctl play-pause
bindl = CTRL $mainMod, Equal, exec, playerctl next
bindl = CTRL $mainMod, Minus, exec, playerctl previous
bindl = CTRL $mainMod, Backspace, exec, playerctl stop

# Caelestia mute key
bindl = $mainMod SHIFT, M, exec, swayosd-client --output-volume mute-toggle


# ── LAPTOP KEYS ──────────────────────────────────────────────

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


# ── CAELESTIA EXTRAS ────────────────────────────────────────

# Clipboard history
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Delete item from clipboard history
bind = $mainMod ALT, V, exec, cliphist list | rofi -dmenu -p "Delete clipboard item" | cliphist delete

# Emoji picker
bind = $mainMod, period, exec, rofimoji --action type

# Color picker + copy color
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# VS Code
bind = $mainMod, C, exec, code

bind = $mainMod SHIFT, W, exec, $HOME/.local/bin/wallpaper-menu
