[general]
bars = 48
framerate = 30
autosens = 1
sensitivity = 100
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 8
bar_delimiter = 32
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
integral = 60
monstercat = 0
waves = 0
gravity = 120
noise_reduction = 80
