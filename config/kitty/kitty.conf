# ============================================================\n# Noctra OS - Kitty Terminal Config (Performance Optimized)\n# ============================================================\n\n# ── Dynamic Colors (Synced via Matugen) ──\ninclude colors.conf\n\n# ── Typography ──\n# Unified with Waybar and Rofi (Strictly Monospaced)\nfont_family      JetBrainsMono Nerd Font\nbold_font        auto\nitalic_font      auto\nbold_italic_font auto\nfont_size        12.0\ndisable_ligatures no\n\n# ── Performance & Behavior ──\n# VSync ENABLED: Matches your 60Hz display, saves battery\nsync_to_monitor yes \n\n# Re-enabled for advanced terminal features (click-to-copy, cwd tracking)\nshell_integration enabled \n\nenable_audio_bell no\nconfirm_os_window_close 0\n\n# ── Aesthetics & UI ──\ncursor_shape block\nurl_style curly\n\n# Layout\nremember_window_size  no\nwindow_padding_width  10\n\n# Hardware-accelerated transparency\nbackground_opacity 0.85\n\n# Invisible scrollbars for minimalism\nscrollbar_handle_opacity      0\nscrollbar_track_opacity       0\nscrollbar_track_hover_opacity 0\n\nshell /usr/bin/fish\n\nshell /usr/bin/fish\n\n# Noctra smooth cursor animation\n\n# Caelestia-like smooth cursor\ncursor_trail 3\ncursor_trail_decay 0.08 0.20\ncursor_trail_start_threshold 1\ncursor_beam_thickness 1.5\ncursor_blink_interval 0.6 ease-in-out\n

# ── Noctra / smooth Kitty ──


background_opacity 0.78
background_blur 32
dynamic_background_opacity yes


# ── Smooth typing / deleting ──
cursor_shape beam
cursor_beam_thickness 1.5

cursor_trail 1
cursor_trail_decay 0.06 0.16
cursor_trail_start_threshold 1
cursor_trail_color none

cursor_blink_interval 0.5 ease-in-out

# smoother rendering
repaint_delay 6
input_delay 1
